name: Release

on:
  push:
    tags:
      # Lowercase v only. Plugin Update Checker strips the prefix with
      # ltrim( $tag, 'v' ), which is case-sensitive: a V1.2.0 tag stays
      # "V1.2.0", version_compare() ranks it below the installed version,
      # and no update is ever offered.
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pure PHP plugin: no Node, no npm, no composer install. The zip script
      # only needs rsync and zip, both present on ubuntu-latest.
      - name: Create plugin zip
        run: bash bin/plugin-zip.sh

      - name: Extract changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^= ${VERSION} =/{found=1} found && /^= [0-9]/ && !/^= ${VERSION} =/{exit} found{print}" readme.txt > changelog_body.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            flipbook-catalog.zip
            readme.txt
          body_path: changelog_body.txt
